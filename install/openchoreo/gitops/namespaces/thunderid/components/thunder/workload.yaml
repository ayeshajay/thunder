apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: thunder
  namespace: thunderid
spec:
  owner:
    componentName: thunder
    projectName: identity-platform
  container:
    image: ghcr.io/asgardeo/thunder:latest
    env:
      - key: SERVER_PORT
        value: "8090"
      - key: JWT_VALIDITY
        value: "3600"
      - key: OAUTH_REFRESH_TOKEN_VALIDITY
        value: "86400"
      - key: CACHE_SIZE
        value: "10000"
      - key: CACHE_TTL
        value: "3600"
      - key: CONSENT_ENABLED
        value: "false"
      - key: CONSENT_BASE_URL
        value: "http://localhost:9090/api/v1"
      - key: GATE_CLIENT_BASE
        value: "/gate"
      - key: CONSOLE_CLIENT_BASE
        value: "/console"
      - key: CONSOLE_CLIENT_ID
        value: "CONSOLE"
      - key: CONSOLE_SCOPES
        value: '["openid", "profile", "email", "system"]'
      - key: CORS_ALLOWED_ORIGINS
        value: '["http://development-thunder-thunderid.openchoreoapis.localhost:19080", "https://localhost:3000"]'
      - key: GATE_CLIENT_PORT
        value: "19080"
      - key: GATE_CLIENT_SCHEME
        value: "http"
      - key: DB_CONFIG_PATH
        value: "repository/database/configdb.db"
      - key: DB_RUNTIME_PATH
        value: "repository/database/runtimedb.db"
      - key: DB_USER_PATH
        value: "repository/database/userdb.db"
      - key: CRYPTO_ENCRYPTION_KEY
        value: "file://repository/resources/security/crypto.key"
    files:
      - key: Console.yaml
        mountPath: /opt/thunder/repository/resources/applications
        value: |
          id: 019ddcf3-c9ce-7f77-8cce-ca2d2f9e81d2
          ou_id: 019ddcf3-c5d8-7375-80e3-c5bf524257c8
          name: Console
          description: Management application for Thunder
          auth_flow_id: 019ddcf3-c92c-7ab5-8b98-207fe7c6f117
          registration_flow_id: 019ddcf3-c92d-7737-b491-babe674edf62
          url: https://localhost:8090/console
          logo_url: emoji:👨‍💻
          assertion:
            validity_period: 3600
          inbound_auth_config:
            - type: oauth2
              config:
                client_id: {{.CONSOLE_CLIENT_ID}}
                redirect_uris:
                  {{- range .CONSOLE_REDIRECT_URIS}}
                  - {{.}}
                  {{- end}}
                grant_types:
                  - authorization_code
                  - refresh_token
                response_types:
                  - code
                token_endpoint_auth_method: none
                pkce_required: true
                public_client: true
                require_pushed_authorization_requests: false
                token:
                  access_token:
                    validity_period: 3600
                    user_attributes:
                      - given_name
                      - family_name
                      - email
                      - groups
                      - name
                      - ouId
                  id_token:
                    validity_period: 3600
                    user_attributes:
                      - given_name
                      - family_name
                      - email
                      - groups
                      - name
                      - ouId
                user_info:
                  response_type: JSON
                  user_attributes:
                    - given_name
                    - family_name
                    - email
                    - groups
                    - name
                    - ouId
                scope_claims:
                  group:
                    - groups
                  ou:
                    - ouId
                  phone:
                    - phone_number
                    - phone_number_verified
                  profile:
                    - name
                    - given_name
                    - family_name
                    - picture
                  email:
                    - email
                    - email_verified
          allowed_user_types:
            - Person
          login_consent:
            validity_period: 0
